name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "notion-clipper-site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Required by actions/deploy-pages; id-token is what proves the deployment
# came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: notion-clipper-site

      - id: pages
        uses: actions/deploy-pages@v4
