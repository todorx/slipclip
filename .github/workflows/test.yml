name: Test extension

on:
  push:
    paths: ["notion-clipper-source/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["notion-clipper-source/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.mjs
        working-directory: notion-clipper-source
